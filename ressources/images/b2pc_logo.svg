<svg viewBox="0 0 500 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients pour effet 3D luxueux -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF88;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00DD77;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00AA55;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.2" />
    </linearGradient>
    
    <!-- Shadow for depth -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00AA55" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(0 55)">
  
  <!-- Texte principal avec effet 3D et perspective -->
  <!-- Shadow/ombre verte en bas (subtile) -->
  <g>
    <defs>
      <style>
        @font-face {
          font-family: 'Impact';
          src: local('Impact'), local('Arial Black');
        }
      </style>
    </defs>
    <text x="250" y="75" font-family="'Impact', 'Arial Black', sans-serif" font-size="110" font-weight="900" 
          text-anchor="middle" fill="#003D22" opacity="0.3" transform="skewX(-10)">B2PC</text>
  </g>
  
  <!-- Texte principal lumineux avec perspective -->
  <g filter="url(#shadow)">
    <text x="250" y="65" font-family="'Impact', 'Arial Black', sans-serif" font-size="110" font-weight="900" 
          text-anchor="middle" fill="url(#greenGrad)" transform="skewX(-10)">B2PC</text>
    
    <!-- Gloss overlay pour effet brillant -->
    <text x="250" y="65" font-family="'Impact', 'Arial Black', sans-serif" font-size="110" font-weight="900" 
          text-anchor="middle" fill="url(#gloss)" transform="skewX(-10)"></text>
  </g>
  
  <!-- Éléments géométriques de style tech retro (plus proches du texte) -->
  <!-- Carré gauche -->
  <rect x="65" y="48" width="20" height="20" fill="none" stroke="#00FF88" stroke-width="2" opacity="0.8"/>
  <rect x="68" y="51" width="14" height="14" fill="#00FF88" opacity="0.2"/>
  
  <!-- Carré droit -->
  <rect x="415" y="48" width="20" height="20" fill="none" stroke="#00FF88" stroke-width="2" opacity="0.8"/>
  <rect x="418" y="51" width="14" height="14" fill="#00FF88" opacity="0.2"/>
  
  <!-- Ligne de connexion gauche vers carré gauche -->
  <line x1="110" y1="58" x2="85" y2="58" stroke="#00FF88" stroke-width="1.5" opacity="0.7"/>
  <circle cx="82" cy="58" r="2" fill="#00FF88" opacity="0.9"/>
  
  <!-- Ligne de connexion droite vers carré droit -->
  <line x1="390" y1="58" x2="415" y2="58" stroke="#00FF88" stroke-width="1.5" opacity="0.7"/>
  <circle cx="418" cy="58" r="2" fill="#00FF88" opacity="0.9"/>
  
  <!-- Tagline retro entre les carrés, plus proche du titre -->
  <text x="250" y="95" font-family="'Courier New', Courier, monospace" font-size="10" 
        text-anchor="middle" fill="#00AA55" opacity="0.9" letter-spacing="0.5" font-weight="bold">BATCH BACKUPS PATCH &amp; CONVERT</text>
  </g>
</svg>